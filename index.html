<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02050a">
<title>CicloCom</title>
<style>
  :root{
    --bg:#000409; --hud:#03101e; --linea:rgba(34,184,255,.22); --linea2:rgba(34,184,255,.55);
    --texto:#e8f6ff; --tenue:#5d7fa6; --cian:#22b8ff; --azul:#0a5cff; --magenta:#7fd6ff; --violeta:#1e6bff; --lima:#cfeeff; --naranja:#ffb020;
    --verde:#3dffa0; --ambar:#ffb020; --rojo:#ff4d4d;
    --sans: "Segoe UI", -apple-system, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--texto);font-family:var(--sans);overflow-x:hidden}
  body{
    background:
      radial-gradient(900px 500px at 50% -10%,rgba(10,92,255,.22),transparent 60%),
      radial-gradient(700px 400px at 0% 100%,rgba(10,92,255,.10),transparent 60%),
      radial-gradient(700px 400px at 100% 100%,rgba(34,184,255,.08),transparent 60%),
      var(--bg);
    display:flex;flex-direction:column;min-height:100vh;
  }
  /* rejilla HUD de fondo */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(34,184,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(34,184,255,.05) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 40%,transparent 85%);
            mask-image:radial-gradient(ellipse at center,#000 40%,transparent 85%);}

  /* ---------- Cabecera ---------- */
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
         padding:14px 20px 6px;position:relative;z-index:1}
  .marca{font-family:var(--mono);font-size:15px;letter-spacing:.42em;color:var(--cian);
         text-shadow:0 0 12px rgba(34,184,255,.8)}
  .marca span{color:var(--tenue);font-size:10px;letter-spacing:.2em;margin-left:12px}
  .reloj{font-family:var(--mono);font-size:13px;color:var(--tenue);letter-spacing:.12em}

  /* ---------- Panel principal ---------- */
  main{flex:1;padding:6px 16px 12px;position:relative;z-index:1;max-width:1240px;width:100%;margin:0 auto;
       display:flex;flex-direction:column;gap:12px}
  .hud{position:relative;border:1px solid var(--linea);border-radius:6px;
       background:linear-gradient(180deg,rgba(3,16,30,.92),rgba(0,4,9,.94));
       box-shadow:inset 0 0 40px rgba(34,184,255,.04),0 0 30px rgba(34,184,255,.05);padding:14px}
  /* esquinas tipo HUD */
  .hud::before,.hud::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--cian);pointer-events:none}
  .hud::before{left:-1px;top:-1px;border-right:none;border-bottom:none;border-top-left-radius:18px}
  .hud::after{right:-1px;bottom:-1px;border-left:none;border-top:none;border-bottom-right-radius:18px}

  .fila-principal{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;align-items:center}
  @media (max-width:760px){ .fila-principal{grid-template-columns:1fr 1fr} .velocidad{grid-column:span 2;order:-1} }
  .anillo{position:relative;width:100%;aspect-ratio:1/1;max-width:300px;margin:0 auto}
  .anillo canvas{width:100%;height:100%;display:block}
  .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .numero{font-family:var(--mono);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 18px currentColor}
  .numero.g{font-size:clamp(46px,8vw,78px);color:#e8f6ff;text-shadow:0 0 22px rgba(34,184,255,.9)}
  .numero.m{font-size:clamp(34px,5.5vw,50px);color:#7fd6ff;text-shadow:0 0 18px rgba(34,184,255,.8)}
  .unidad{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--tenue);margin-top:6px}
  .etiqueta{position:absolute;top:0;left:0;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--tenue)}

  /* ---------- Estadísticas ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:760px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{border:1px solid var(--linea);border-top:2px solid var(--violeta);border-radius:4px;padding:10px 12px;background:rgba(10,92,255,.06)}
  .stat small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--tenue);text-transform:uppercase}
  .stat b{display:block;font-family:var(--mono);font-size:24px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--texto)}
  .stat b i{font-style:normal;font-size:11px;color:var(--tenue);letter-spacing:.16em;margin-left:4px}
  .stat.acento{border-top-color:var(--cian)} .stat.acento b{color:var(--cian)}

  /* ---------- Barra de conexión (en línea) ---------- */
  .conexion{position:relative;z-index:1;border-top:1px solid var(--linea);background:rgba(3,8,16,.92);
            backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 16px 14px}
  .linea{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
  .btn{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
       padding:11px 16px;border-radius:10px;border:1px solid var(--c,var(--cian));color:var(--c,var(--cian));
       background:rgba(255,255,255,.02);cursor:pointer;transition:box-shadow .2s,transform .08s,opacity .2s;white-space:nowrap}
  .btn:hover{box-shadow:0 0 14px var(--c,var(--cian))}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
  .btn.p{--c:var(--cian);background:rgba(34,184,255,.1)}
  .btn.r{--c:#7fd6ff}
  .btn.d{--c:var(--cian)}
  .btn.d{--c:var(--ambar)}
  .sep{width:1px;height:28px;background:var(--linea)}
  .luz{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tenue);white-space:nowrap}
  .led{width:9px;height:9px;border-radius:50%;background:var(--rojo);box-shadow:0 0 8px var(--rojo)}
  .led.v{background:var(--verde);box-shadow:0 0 8px var(--verde)}
  .led.a{background:var(--ambar);box-shadow:0 0 8px var(--ambar)}
  .cal{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--tenue)}
  .punto{width:10px;height:10px;border-radius:50%;border:1px solid var(--cian)}
  .punto.on{background:var(--cian);box-shadow:0 0 8px var(--cian)}
  .estado-texto{font-family:var(--mono);font-size:11px;letter-spacing:.16em;padding:6px 10px;border-radius:999px;border:1px solid var(--linea);color:var(--tenue)}
  .estado-texto.on{color:var(--verde);border-color:var(--verde)}
  .estado-texto.demo{color:var(--ambar);border-color:var(--ambar)}

  .registro{font-family:var(--mono);font-size:11px;line-height:1.55;max-width:1240px;margin:10px auto 0;
            height:64px;overflow:auto;color:var(--tenue);border-top:1px dashed var(--linea);padding-top:8px}
  .registro div{white-space:pre-wrap;word-break:break-word}
  .registro .ok{color:var(--verde)} .registro .warn{color:var(--ambar)} .registro .err{color:var(--rojo)}
  .aviso{font-family:var(--mono);font-size:11px;color:var(--ambar);max-width:1240px;margin:4px auto 0;min-height:1em}
  @media (max-width:760px){ .sep{display:none} .btn{flex:1 1 auto;text-align:center} }

  /* ---------- Ajuste para iPhone: todo en una sola pantalla ---------- */
  @media (max-width:760px){
    html,body{height:100%;overflow:hidden}
    body{height:100dvh;min-height:0}
    header{padding:10px 14px 2px}
    .marca{font-size:13px;letter-spacing:.32em}
    .marca span{display:none}
    main{padding:4px 10px 6px;gap:8px;min-height:0;flex:1;justify-content:center}
    .hud{padding:8px 10px 6px}
    .fila-principal{gap:6px}
    .anillo{max-width:150px}
    .velocidad{max-width:210px}
    .numero.g{font-size:52px}
    .numero.m{font-size:34px}
    .unidad{margin-top:2px;font-size:10px}
    .etiqueta{font-size:9px}
    .stats{gap:6px}
    .stat{padding:6px 8px}
    .stat small{font-size:9px;letter-spacing:.16em}
    .stat b{font-size:19px;margin-top:2px}
    .stat b i{font-size:9px}
    .conexion{padding:8px 10px 8px}
    .linea{gap:6px}
    .btn{flex:1 1 0;padding:9px 6px;font-size:11px;letter-spacing:.1em;text-align:center}
    .luz{font-size:10px;letter-spacing:.08em}
    .cal,.estado-texto{font-size:10px}
    .aviso{display:none}
    .registro{height:34px;font-size:10px;line-height:1.35;margin-top:6px;padding-top:4px}
  }
  @media (max-width:760px) and (max-height:700px){
    .anillo{max-width:130px}
    .velocidad{max-width:180px}
  }
</style>
</head>
<body>

<header>
  <div class="marca">CICLOCOM<span>TELEMETRIA · ESP32</span></div>
  <div class="reloj" id="reloj">--:--:--</div>
</header>

<main>
  <section class="hud">
    <div class="fila-principal">
      <!-- Cadencia -->
      <div class="anillo">
        <span class="etiqueta">CADENCIA</span>
        <canvas id="cCad"></canvas>
        <div class="centro"><div class="numero m" id="vCad">0</div><div class="unidad">RPM</div></div>
      </div>

      <!-- Velocidad (principal) -->
      <div class="anillo velocidad">
        <span class="etiqueta">VELOCIDAD</span>
        <canvas id="cVel"></canvas>
        <div class="centro"><div class="numero g" id="vVel">0.0</div><div class="unidad">KM/H</div></div>
      </div>

      <!-- Horizonte -->
      <div class="anillo">
        <span class="etiqueta">HORIZONTE</span>
        <canvas id="cHor"></canvas>
        <div class="centro" style="top:auto;bottom:6%;height:auto;">
          <div class="unidad" id="vAng" style="margin:0;letter-spacing:.16em">P 0.0° · R 0.0°</div>
        </div>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat acento"><small>Distancia</small><b><span id="vDist">0.000</span><i>KM</i></b></div>
    <div class="stat"><small>Vel. máxima</small><b><span id="vMax">0.0</span><i>KM/H</i></b></div>
    <div class="stat"><small>Tiempo activo</small><b id="vTiempo">00:00:00</b></div>
    <div class="stat"><small>Bogotá ahora</small><b><span id="vTemp">--</span><i>°C</i></b><small id="vRango" style="margin-top:4px;letter-spacing:.14em;text-transform:none">máx -- · mín --</small></div>
  </section>
</main>

<footer class="conexion">
  <div class="linea">
    <button class="btn p" id="btnConectar">Conectar</button>
    <button class="btn r" id="btnRecal" disabled>Recalibrar</button>
    <button class="btn d" id="btnDemo">Demo</button>
    <span class="sep"></span>
    <span class="luz"><span class="led" id="lBt"></span>BT</span>
    <span class="luz"><span class="led" id="lMpu"></span>MPU</span>
    <span class="luz"><span class="led" id="lRue"></span>HALL RUEDA</span>
    <span class="luz"><span class="led" id="lCad"></span>HALL CAD</span>
    <span class="sep"></span>
    <span class="cal">CAL <span class="punto" id="p1"></span><span class="punto" id="p2"></span><span class="punto" id="p3"></span><span id="txtCal">0/3</span></span>
    <span class="estado-texto" id="estado">SIN CONEXION</span>
  </div>
  <div class="aviso" id="avisoCal"></div>
  <div class="registro" id="registro"></div>
</footer>

<script>
// ============================ CONFIGURACIÓN ============================
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const NOMBRE_BLE   = "BiciESP32";
const UMBRAL_BT_MS = 4000;
const VEL_MAX = 50, CAD_MAX = 120;

// ============================ ESTADO ============================
const st = {
  dev: null, car: null, conectado: false,
  demo: false, demoTimer: null, t: 0,
  ultimo: 0, inicio: null, tUlt: null,
  dist: 0, velMax: 0, datos: {},
  // valores mostrados (se suavizan hacia los reales)
  vis: { vel: 0, cad: 0, pt: 0, rl: 0 }
};

const $ = id => document.getElementById(id);
const fmt = (v, d) => (typeof v === "number" && isFinite(v)) ? v.toFixed(d) : "--";
const p2 = n => String(n).padStart(2, "0");

function log(texto, tipo = "") {
  const r = $("registro");
  const d = document.createElement("div");
  d.className = tipo;
  d.textContent = new Date().toLocaleTimeString("es-CO", {hour12:false}) + "  " + texto;
  r.appendChild(d);
  r.scrollTop = r.scrollHeight;
}

function describirError(e) {
  const n = (e && e.name) ? e.name : "Error";
  const m = (e && e.message) ? e.message : (typeof e === "string" ? e : "sin detalle del navegador");
  return `${n}: ${m}`;
}

function parsear(texto) {
  const r = {};
  texto.trim().split(",").forEach(par => {
    const i = par.indexOf("=");
    if (i > 0) {
      const v = par.slice(i + 1).trim(), n = Number(v);
      r[par.slice(0, i).trim()] = isNaN(n) ? v : n;
    }
  });
  return r;
}

// ============================ PROCESAMIENTO ============================
function procesar(p) {
  st.datos = { ...st.datos, ...p };
  st.ultimo = Date.now();
  if (st.inicio === null) st.inicio = st.ultimo;
  if (st.tUlt !== null && typeof st.datos.vel === "number")
    st.dist += (st.datos.vel / 3600) * ((st.ultimo - st.tUlt) / 1000);
  st.tUlt = st.ultimo;
  if (typeof st.datos.vel === "number") st.velMax = Math.max(st.velMax, st.datos.vel);
  pintarTextos();
  pintarEstado();
}

function pintarTextos() {
  const d = st.datos;
  $("vDist").textContent = st.dist.toFixed(3);
  $("vMax").textContent = fmt(st.velMax, 1);
  $("vAng").textContent = `P ${fmt(d.pt,1)}°  ·  R ${fmt(d.rl,1)}°`;
}

function pintarEstado() {
  const d = st.datos, edad = Date.now() - st.ultimo;
  const activo = st.conectado || st.demo;
  let bt = "led";
  if (activo) bt += edad <= UMBRAL_BT_MS ? " v" : " a";
  $("lBt").className = bt;
  $("lMpu").className = "led" + (d.sm === 1 ? " v" : "");
  const h = s => s === 2 ? " v" : (s === 1 ? " a" : "");
  $("lRue").className = "led" + h(d.sr ?? 0);
  $("lCad").className = "led" + h(d.sc ?? 0);

  const cv = d.cv ?? 0;
  ["p1","p2","p3"].forEach((id, i) => $(id).classList.toggle("on", i < cv));
  $("txtCal").textContent = cv + "/3";
  $("avisoCal").textContent = (d.cal ?? 0) === 2 ? "" : "Gira la rueda 3 vueltas en línea recta, sin pedalear, para calibrar.";

  const e = $("estado");
  if (st.demo) { e.textContent = "DEMO"; e.className = "estado-texto demo"; }
  else if (st.conectado) {
    e.textContent = edad <= UMBRAL_BT_MS ? "CONECTADO" : "SIN DATOS";
    e.className = "estado-texto " + (edad <= UMBRAL_BT_MS ? "on" : "");
  } else { e.textContent = "SIN CONEXION"; e.className = "estado-texto"; }
  $("btnRecal").disabled = !st.conectado;
}


// ============================ CLIMA DE BOGOTÁ ============================
// Temperatura real de Bogotá del día (Open-Meteo, sin clave), actualizada cada 10 min
const URL_CLIMA = "https://api.open-meteo.com/v1/forecast?latitude=4.711&longitude=-74.0721" +
  "&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min" +
  "&timezone=America%2FBogota&forecast_days=1";

async function actualizarClima() {
  try {
    const r = await fetch(URL_CLIMA, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const ahora = j.current && j.current.temperature_2m;
    const max = j.daily && j.daily.temperature_2m_max && j.daily.temperature_2m_max[0];
    const min = j.daily && j.daily.temperature_2m_min && j.daily.temperature_2m_min[0];
    $("vTemp").textContent = fmt(ahora, 1);
    $("vRango").textContent = `máx ${fmt(max, 1)} · mín ${fmt(min, 1)}`;
    log("Clima de Bogotá actualizado: " + fmt(ahora, 1) + " °C.", "ok");
  } catch (e) {
    $("vTemp").textContent = "--";
    log("No se pudo leer el clima de Bogotá: " + describirError(e), "warn");
  }
}
actualizarClima();
setInterval(actualizarClima, 10 * 60 * 1000);

// ============================ TIEMPO Y RELOJ ============================
setInterval(() => {
  const now = new Date();
  $("reloj").textContent = `${p2(now.getHours())}:${p2(now.getMinutes())}:${p2(now.getSeconds())}`;
  if (st.inicio !== null) {
    const s = Math.floor((Date.now() - st.inicio) / 1000);
    $("vTiempo").textContent = `${p2(Math.floor(s/3600))}:${p2(Math.floor(s/60)%60)}:${p2(s%60)}`;
  }
  pintarEstado();
}, 1000);

// ============================ RENDER HUD (animado) ============================
// Anillo con escala, marcas y brillo; valores suavizados hacia los reales
function prepararCanvas(c) {
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function anillo(c, valor, max, color, marcas = 60) {
  const { ctx, w, h } = prepararCanvas(c);
  const cx = w / 2, cy = h / 2, r = Math.max(10, Math.min(w, h) / 2 - 16);
  if (w < 40 || h < 40) return;
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, f = Math.max(0, Math.min(1, valor / max));
  // marcas
  for (let i = 0; i <= marcas; i++) {
    const a = a0 + (a1 - a0) * i / marcas;
    const mayor = i % 5 === 0;
    const r1 = r + 6, r2 = r + (mayor ? 14 : 10);
    ctx.strokeStyle = (i / marcas <= f) ? color : "rgba(95,127,163,.35)";
    ctx.lineWidth = mayor ? 1.8 : 1;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    ctx.stroke();
  }
  // pista
  ctx.lineCap = "round"; ctx.lineWidth = 8;
  ctx.strokeStyle = "rgba(34,184,255,.08)";
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
  // arco de valor con brillo
  ctx.strokeStyle = color; ctx.lineWidth = 8;
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * f); ctx.stroke();
  ctx.shadowBlur = 0;
  // anillo interior fino
  ctx.strokeStyle = "rgba(34,184,255,.18)"; ctx.lineWidth = 1;
  if (r - 18 > 2) { ctx.beginPath(); ctx.arc(cx, cy, r - 18, 0, Math.PI * 2); ctx.stroke(); }
}

function horizonte(c, pt, rl) {
  const { ctx, w, h } = prepararCanvas(c);
  const cx = w / 2, cy = h / 2, R = Math.max(10, Math.min(w, h) / 2 - 16);
  if (w < 40 || h < 40) return;
  const roll = rl * Math.PI / 180, desp = pt * (R / 45);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(-roll); ctx.translate(0, desp);
  const g1 = ctx.createLinearGradient(0, -R * 2, 0, 0);
  g1.addColorStop(0, "#06305e"); g1.addColorStop(1, "#0f5fa8");
  const g2 = ctx.createLinearGradient(0, 0, 0, R * 2);
  g2.addColorStop(0, "#5a3414"); g2.addColorStop(1, "#2a180a");
  ctx.fillStyle = g1; ctx.fillRect(-R * 2, -R * 2, R * 4, R * 2);
  ctx.fillStyle = g2; ctx.fillRect(-R * 2, 0, R * 4, R * 2);
  ctx.strokeStyle = "rgba(230,246,255,.85)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-R * 2, 0); ctx.lineTo(R * 2, 0); ctx.stroke();
  ctx.strokeStyle = "rgba(230,246,255,.35)";
  for (let k = -30; k <= 30; k += 10) {
    if (!k) continue;
    const y = -k * (R / 45);
    ctx.beginPath(); ctx.moveTo(-R * .22, y); ctx.lineTo(R * .22, y); ctx.stroke();
  }
  ctx.restore();
  // referencia fija
  ctx.strokeStyle = "#ffc93d"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - R * .5, cy); ctx.lineTo(cx - R * .18, cy);
  ctx.moveTo(cx + R * .18, cy); ctx.lineTo(cx + R * .5, cy);
  ctx.stroke();
  ctx.strokeStyle = "rgba(34,184,255,.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
}

function frame() {
  const v = st.vis, d = st.datos;
  v.vel += ((d.vel ?? 0) - v.vel) * 0.18;
  v.cad += ((d.cad ?? 0) - v.cad) * 0.18;
  const zona = (f, colores) => colores[f < .4 ? 0 : f < .7 ? 1 : f < .85 ? 2 : 3];
  const colVel = zona(v.vel / VEL_MAX, ["#1e90ff", "#4fc3ff", "#ffb020", "#ff4d4d"]);
  const colCad = zona(v.cad / CAD_MAX, ["#0a5cff", "#22b8ff", "#cfeeff", "#ff4d4d"]);
  v.pt  += ((d.pt ?? 0) - v.pt) * 0.2;
  v.rl  += ((d.rl ?? 0) - v.rl) * 0.2;
  $("vVel").textContent = v.vel.toFixed(1);
  $("vCad").textContent = Math.round(v.cad);
  anillo($("cVel"), v.vel, VEL_MAX, colVel, 60);
  anillo($("cCad"), v.cad, CAD_MAX, colCad, 48);
  horizonte($("cHor"), v.pt, v.rl);
  requestAnimationFrame(frame);
}

// ============================ BLUETOOTH ============================
async function conectar() {
  log("Verificando soporte Web Bluetooth…");
  if (!navigator.bluetooth) { log("Este navegador no tiene Web Bluetooth. Abre la página con Bluefy.", "err"); return; }
  if (location.protocol !== "https:" && location.hostname !== "localhost")
    log("La página no está en https. Web Bluetooth necesita https (GitHub Pages).", "warn");
  if (st.demo) detenerDemo();
  try {
    log("Buscando " + NOMBRE_BLE + "… elige el dispositivo en la lista.");
    st.dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SERVICE_UUID] });
    log("Dispositivo elegido: " + (st.dev.name || "sin nombre"), "ok");
    st.dev.addEventListener("gattserverdisconnected", () => {
      st.conectado = false; log("Conexión perdida. Pulsa Conectar para reintentar.", "warn"); pintarEstado();
    });
    log("Conectando al servidor GATT…");
    const srv = await st.dev.gatt.connect();
    log("Buscando servicio CicloCom…");
    const svc = await srv.getPrimaryService(SERVICE_UUID);
    st.car = await svc.getCharacteristic(CHAR_UUID);
    log("Activando notificaciones…");
    await st.car.startNotifications();
    st.car.addEventListener("characteristicvaluechanged", ev => procesar(parsear(new TextDecoder().decode(ev.target.value))));
    st.conectado = true;
    log("Conectado. Recibiendo datos.", "ok");
    pintarEstado();
  } catch (e) {
    st.conectado = false;
    log("No se conectó. " + describirError(e), "err");
    if (e && e.name === "NotFoundError") log("Revisa que el ESP32 esté encendido y anunciando BiciESP32.", "warn");
    pintarEstado();
  }
}

async function recalibrar() {
  if (!st.car) return;
  try { await st.car.writeValue(new TextEncoder().encode("c")); log("Recalibración solicitada.", "ok"); }
  catch (e) { log("No se envió el comando: " + describirError(e), "err"); }
}

// ============================ DEMO ============================
function iniciarDemo() {
  if (st.conectado) { log("Desconecta antes de activar la demo.", "warn"); return; }
  st.demo = true;
  log("Demo activa: datos simulados, no son mediciones.", "warn");
  st.demoTimer = setInterval(() => {
    const t = (st.t += 0.5);
    procesar(parsear(
      `cad=${(75+12*Math.sin(t/5)).toFixed(0)},vel=${(18+6*Math.sin(t/9)).toFixed(2)},` +
      `ax=${(0.1*Math.sin(t)).toFixed(2)},ay=${(0.05*Math.cos(t)).toFixed(2)},az=0.98,` +
      `gx=${(2*Math.sin(t/3)).toFixed(1)},gy=${(1.5*Math.cos(t/4)).toFixed(1)},gz=0.4,` +
      `tc=${(28+0.5*Math.sin(t/20)).toFixed(1)},a0c=${Math.round(2000+800*Math.sin(t))},` +
      `a0r=${Math.round(2100+900*Math.cos(t))},sr=2,sc=2,sm=1,cal=2,cv=3,` +
      `rl=${(4*Math.sin(t/6)).toFixed(1)},pt=${(2*Math.cos(t/7)).toFixed(1)}`));
  }, 500);
  $("btnDemo").textContent = "Detener";
  pintarEstado();
}

function detenerDemo() {
  clearInterval(st.demoTimer); st.demoTimer = null; st.demo = false;
  $("btnDemo").textContent = "Demo";
  log("Demo detenida.");
  pintarEstado();
}

// ============================ EVENTOS ============================
$("btnConectar").addEventListener("click", conectar);
$("btnRecal").addEventListener("click", recalibrar);
$("btnDemo").addEventListener("click", () => st.demo ? detenerDemo() : iniciarDemo());

log("CicloCom listo. Pulsa Conectar con el ESP32 encendido.");
if (!navigator.bluetooth) log("Web Bluetooth no disponible en este navegador (usa Bluefy en iPhone).", "warn");
pintarEstado();
requestAnimationFrame(frame);
</script>
